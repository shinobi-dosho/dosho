[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dosho"
version = "0.1.0b3"
description = "A shinobi's tool bag -- the native shinobi (stimela-ninja) cab repository"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sphesihle Makhathini", email = "sphemakh@gmail.com" },
]
dependencies = [
    "stimela-ninja>=0.1.0b3",
    "pyyaml>=6.0",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.5",
]
# Documentation build (Sphinx + Furo + autodoc). `uv sync --group docs`.
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]

# Dev-time override: pull stimela-ninja from its origin/main instead of the
# pinned PyPI release, so dosho and stimela-ninja can be developed together
# (e.g. the `positional_head` parset support). Ignored when dosho is built
# for publishing -- consumers still resolve the PyPI `stimela-ninja>=...`
# constraint above.
[tool.uv.sources]
stimela-ninja = { git = "https://github.com/shinobi-dosho/stimela-ninja", branch = "main" }

[project.urls]
Homepage = "https://github.com/SpheMakh/dosho"
Repository = "https://github.com/SpheMakh/dosho"
Issues = "https://github.com/SpheMakh/dosho/issues"
Documentation = "https://dosho.readthedocs.io"

[project.scripts]
dosho = "dosho.cli:main"

[project.entry-points."shinobi.cabs"]
dosho = "dosho.registry"

[tool.hatch.build.targets.wheel]
packages = ["src/dosho"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/dosho",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `select`, not `extend-select` and not the implicit default. This list is the
# repo's *whole* ruleset, stated outright rather than inherited from whatever
# ruff happens to enable this month.
#
# There was no [lint] section at all before, which meant "whatever ruff
# defaults to" -- and ruff 0.16.0 widened that default. `uv.lock` is untracked
# and the dev group asks for `ruff>=0.5`, so CI resolves a fresh ruff every
# run and picked the change up immediately: 30 findings across nine files
# nobody had touched, turning the next PR red with nothing in it to blame.
# (0.15.0 on the same tree: clean.) The set below is what this repo has
# actually been enforcing all along.
#
# Adopting a broader ruleset is a fine thing to decide -- but it should be
# decided, not inherited from a dependency bump. Add rules here deliberately.
# (caracal2's own ruff.toml carries this same fix, for the same reason.)
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime/syntax errors
    "F",   # pyflakes
]
