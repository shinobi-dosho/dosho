  ddfacet:
    attr: ddfacet
    document: ddfacet.yaml
    experimental: 'DDFacet is a rogue sibling upstream dosho supports on a best-effort basis: its `DefaultParset.cfg`
      carries no usable `#type:` tags (so every path arrived as a bare `str` and had to be classified
      from help text), and `Output-Images` letter codes name its image family at run time. Its I/O *is*
      declared -- products as output fields plus a harvest glob, cache and log as `scratch` -- so nothing
      is silently lost. What remains: individual per-major-cycle images (`.mask00`, `.Taylor0.00`) are
      harvested but cannot be wired as an `OutputRef`, since only the tool knows which letter codes a
      given run emits; and `Cache-DirWisdomFFTW` is undeclared because its `~/.fftw_wisdom` default is
      HOME-relative, which shinobi resolves against the working directory rather than $HOME. Expect to
      verify a DDFacet upgrade against this cab rather than assuming the schema held still'
  deconvolve:
    attr: deconvolve
    module: dosho.cabs.casatasks
    symbol: deconvolve
