  killms:
    attr: killms
    document: killms.yaml
    experimental: 'killMS is a rogue sibling upstream dosho supports on a best-effort basis: its `DefaultParset.cfg`
      declares almost no types, and it mangles its own output name internally (`reformat(MSName)` + `SolsName`).
      Its I/O *is* declared -- the solutions directory as an output, the DDF cache as `scratch` -- so
      nothing is silently lost. What remains: the `.sols.npz` path itself cannot be named, so a downstream
      step wires the solutions *directory* plus the solution name, which is what DDFacet''s `DDESolutions-SolsDir`/`DDESolutions-DDSols`
      want anyway. Expect to verify a killMS upgrade against this cab rather than assuming the schema
      held still'
