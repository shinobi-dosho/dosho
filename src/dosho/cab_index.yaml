# The registry's map of every cab this repo provides.
#
# Maintained by hand. It was generated while the Python cab definitions still
# existed and could be introspected; they are the documents now, and deriving
# this from them would be circular -- `attr` in particular is not derivable
# (`msutils-addcol` is imported as `addcol`).
#
#   <registered name>:
#     attr:         the name `dosho.cabs` exports it as
#     document:     its file under documents/, for a binary cab
#     experimental: why, if it is
#
# A pystep has no `document`: it is a Python function and stays one.
# tests/test_documents.py checks this against the documents and the modules.
