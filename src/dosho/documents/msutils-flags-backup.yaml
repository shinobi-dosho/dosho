cabs:
  msutils-flags-backup:
    command: msutils flags backup
    image: MSUTILS
    info: 'msutils flags backup: save an MS''s current flags as a named version'
    cache: false
    inputs:
      ms:
        dtype: MSv2
        required: true
        info: Measurement set whose flags to save
        policies:
          positional: true
        writable: false
      name:
        dtype: str
        info: 'Version name [default: a timestamp]. Give one whenever a later step has to restore it by
          name.'
      description:
        dtype: str
        info: Note stored with the version.
      overwrite:
        dtype: bool
        info: Replace a version of this name.
    dataset_accesses:
    - field: ms
      mode: read
      columns:
        read:
        - FLAG
        - FLAG_ROW
        write: []
      exclusive: true
    outputs:
      flagversions:
        dtype: ProductFamily[DirectoryBundle]
        info: Attached history; exclusive associated MS ownership blocks every concurrent MS access.
        family:
          root: '{ms}.flagversions'
          coordinates: {}
          rules:
          - path: .
            accept_existing: true
