cabs:
  msutils-flags-backup:
    command: msutils flags backup
    image: MSUTILS
    info: 'msutils flags backup: save an MS''s current flags as a named version'
    # Never skipped by the step cache: the saved version lives in
    # <ms>.flagversions, which cannot be a declared output (shinobi clears a
    # declared output before each run, deleting every saved version), so a
    # cache hit could not tell that directory had gone.
    cache: false
    inputs:
      ms:
        dtype: MSv2
        required: true
        info: Measurement set whose flags to save
        policies:
          positional: true
      name:
        dtype: str
        info: 'Version name [default: a timestamp]. Give one whenever a later step has to restore it
          by name.'
      description:
        dtype: str
        info: Note stored with the version.
      overwrite:
        dtype: bool
        info: Replace a version of this name.
    # A reader: backup never writes the MS itself, so `ms` is neither mutable
    # (a mutable field may not declare only a read) nor echoed as an output (a
    # same-named output makes it a filesystem write).
    dataset_accesses:
      # msutils flags.py: reads FLAG and FLAG_ROW, copies them to <ms>.flagversions/ beside the MS.
      - field: ms
        mode: read
        columns:
          read: [FLAG, FLAG_ROW]
