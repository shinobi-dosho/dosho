cabs:
  smops:
    command: smops
    image: SMOPS
    info: 'smops: Smooth Operator, frequency axis upsampling for WSClean-derived model images (https://github.com/ratt-ru/smops)'
    inputs:
      ms:
        dtype: MS
        required: true
        info: Input MS. Used for getting reference frequency
      input_prefix:
        dtype: str
        required: true
        nom_de_guerre: input-prefix
        info: The input image prefix, same as the one used for wsclean
      channels_out:
        dtype: int
        required: true
        nom_de_guerre: channels-out
        info: Number of channels to generate out
      polynomial_order:
        dtype: int
        required: true
        nom_de_guerre: polynomial-order
        info: Order of the spectral polynomial
      max_mem:
        dtype: int
        nom_de_guerre: max-mem
        info: Approximate memory cap in GB. Default is 10% of available memory.
      num_threads:
        dtype: int
        nom_de_guerre: num-threads
        info: Number of threads to use while writing out output images
      output_prefix:
        dtype: str
        nom_de_guerre: output-prefix
        info: What to prefix the new interpolated model name with
      stokes:
        dtype: str
        info: Which stokes model to extrapolate, e.g. 'IQUV'. Required when there are multiple Stokes
          images in a directory. Default I.
