      temp-dir:
        dtype: Directory
        write_path: true
        info: Scratch location for temporary reordered MeasurementSets.
    # Filename rules transcribed from WSClean v3.6 io/imagefilename.h and
    # main/wsclean.cpp (https://gitlab.com/aroffringa/wsclean/-/tree/v3.6).
    # Optional rules capture newly written/changed products, or explicit reuse
    # of a model in continuation mode.
    # Prediction reads model images at this prefix, so it must reserve no FITS
    # outputs (in particular, stale-output clearing must not delete its inputs).
    outputs:
      image:
        dtype: ProductFamily[File]
        info: Image FITS products indexed by time, frequency, polarization and component.
        family:
          coordinates: {time: int, frequency: [int, str], polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-image.fits'
              coordinates: {component: real}
              when: &imaging_mode {predict: [false], dry_run: [false], make_psf_only: [false]}
              axes: &image_axes
                time: &time_axis
                  count_input: intervals_out
                  suffix: '-t{index:04d}'
                  singleton_suffix: ''
                frequency: &frequency_axis
                  count_input: nchan
                  suffix: '-{index:04d}'
                  singleton_suffix: ''
                  aggregate: {value: mfs, suffix: '-MFS', only_multiple: true}
                polarization: &polarization_axis
                  values_input: pol
                  tokens: [I, Q, U, V, XX, XY, YX, YY, RR, RL, LR, LL]
                  # YX is combined with XY, never written separately.
                  include: [I, Q, U, V, XX, XY, YY, RR, RL, LR, LL]
                  uppercase: true
                  split: csv_or_compact
                  suffix: '-{value}'
                  singleton_suffix: ''
            - path: '{prefix}{time}{frequency}{polarization}-image.fits'
              coordinates: {component: imaginary}
              when: *imaging_mode
              axes: &imaginary_axes
                time: *time_axis
                frequency: *frequency_axis
                polarization:
                  <<: *polarization_axis
                  include: [XY]
                  suffix: '-{value}i'
      dirty:
        dtype: ProductFamily[File]
        info: Dirty FITS products indexed by time, frequency, polarization and component.
        family:
          coordinates: {time: int, frequency: [int, str], polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-dirty.fits'
              coordinates: {component: real}
              when: &dirty_mode {predict: [false], dry_run: [false], make_psf_only: [false], no_dirty: [false]}
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-dirty.fits'
              coordinates: {component: imaginary}
              when: *dirty_mode
              axes: *imaginary_axes
      residual:
        dtype: ProductFamily[File]
        info: Residual FITS products indexed by time, frequency, polarization and component.
        family:
          coordinates: {time: int, frequency: [int, str], polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-residual.fits'
              coordinates: {component: real}
              when: *imaging_mode
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-residual.fits'
              coordinates: {component: imaginary}
              when: *imaging_mode
              axes: *imaginary_axes
      model:
        dtype: ProductFamily[File]
        info: Model FITS products indexed by time, frequency, polarization and component.
        family:
          coordinates: {time: int, frequency: [int, str], polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [false]}
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [false]}
              axes: *imaginary_axes
            # Only channel models selected by native prediction are reused.
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: false}
              axes: &continued_real_axes
                time: *time_axis
                frequency: &continued_frequency_real
                  count_input: nchan
                  suffix: '-{index:04d}'
                  singleton_suffix: ''
                polarization: *polarization_axis
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: false}
              axes:
                time: *time_axis
                frequency:
                  <<: *frequency_axis
                  include: []
                polarization: *polarization_axis
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [true]}
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [true]}
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: true}
              axes: *image_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: real}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: true}
              axes: *image_axes
            # Only channel models selected by native prediction are reused.
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: false}
              axes: &continued_imaginary_axes
                time: *time_axis
                frequency: &continued_frequency_imaginary
                  count_input: nchan
                  suffix: '-{index:04d}'
                  singleton_suffix: ''
                polarization:
                  <<: *polarization_axis
                  include: [XY]
                  suffix: '-{value}i'
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: false}
              axes:
                time: *time_axis
                frequency:
                  <<: *frequency_axis
                  include: []
                polarization:
                  <<: *polarization_axis
                  include: [XY]
                  suffix: '-{value}i'
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [true]}
              axes: *imaginary_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [true]}
              axes: *imaginary_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: true}
              axes: *imaginary_axes
            - path: '{prefix}{time}{frequency}{polarization}-model.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], dry_run: [false], make_psf_only: [false], continue_: [true], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: true}
              axes: *imaginary_axes
      psf:
        dtype: ProductFamily[File]
        info: Shared PSF FITS products indexed by time and frequency; no polarization axis.
        family:
          coordinates: {time: int, frequency: [int, str]}
          rules:
            - path: '{prefix}{time}{frequency}-psf.fits'
              when: {predict: [false], dry_run: [false]}
              axes:
                time: *time_axis
                frequency: *frequency_axis
      source-list:
        dtype: ProductFamily[File]
        info: Component list emitted by -save-source-list; no channel or polarization suffix.
        family:
          coordinates: {}
          rules:
            - path: '{prefix}-sources.txt'
              when: {predict: [false], dry_run: [false], save_source_list: [true]}
      continued_beam_model:
        dtype: ProductFamily[File]
        info: Existing beam-corrected model files read and updated in continuation mode.
        family:
          coordinates: {time: int, frequency: int, polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: real}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [true]}
              axes: &beam_read_real_axes
                time: *time_axis
                frequency: &beam_read_frequency_axis
                  count_input: nchan
                  suffix: '-{index:04d}'
                  singleton_suffix: ''
                polarization: *polarization_axis
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [true]}
              axes: &beam_read_imaginary_axes
                time: *time_axis
                frequency: *beam_read_frequency_axis
                polarization:
                  <<: *polarization_axis
                  include: [XY]
                  suffix: '-{value}i'
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: real}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: true}
              axes: *beam_read_real_axes
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: true}
              axes: *beam_read_imaginary_axes
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: real}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: true}
              axes: *beam_read_real_axes
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-pb.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [false], grid_with_beam: [false]}
              when_set: {aterm_config: false, apply_facet_solutions: true}
              axes: *beam_read_imaginary_axes
              accept_existing: true
      continued_facet_beam_model:
        dtype: ProductFamily[File]
        info: Existing beam-corrected model files read and updated in continuation mode.
        family:
          coordinates: {time: int, frequency: int, polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-model-fpb.fits'
              coordinates: {component: real}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [true]}
              axes: *beam_read_real_axes
              accept_existing: true
            - path: '{prefix}{time}{frequency}{polarization}-model-fpb.fits'
              coordinates: {component: imaginary}
              when: {predict: [false], continue_: [true], dry_run: [false], make_psf_only: [false], apply_facet_beam: [true]}
              axes: *beam_read_imaginary_axes
              accept_existing: true
    # PredictModelFileSuffix() (v3.6 main.h): facet beam wins over a-term
    # gridding/facet solutions, then the ordinary model suffix. No MFS reads.
    derived_reads:
      input_models:
        member: file
        family:
          coordinates: {time: int, frequency: int, polarization: str, component: str}
          rules:
            - path: '{prefix}{time}{frequency}{polarization}-model-fpb.fits'
              coordinates: {component: real}
              when: {predict: [true], dry_run: [false], apply_facet_beam: [true]}
              required: true
              axes: &read_real_axes
                time: *time_axis
