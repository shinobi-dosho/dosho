cabs:
  wsclean:
    command: wsclean
    image: WSCLEAN
    info: WSClean imager (https://wsclean.readthedocs.io)
    policies:
      prefix: '-'
      replace:
        _: '-'
    harvest:
    - '{prefix}-*'
    scratch: ['{temp_dir}/*']
    dataset_accesses:
      # One joint write over every MS in `ms`. WSClean writes `model-column`
      # (MODEL_DATA) after deconvolution unless `no-update-model-required`, and
      # on `predict`; a static contract cannot follow those flags, so every run
      # is a writer. Columns are left unset (whole dataset) because a column
      # named under `create` must exist afterwards -- a dirty-image run
      # (niter=0) never writes MODEL_DATA -- and `store-imaging-weights` adds
      # IMAGING_WEIGHT, which a known column list would refuse.
      - field: ms
        mode: write
        allow_schema_change: true
    output_patterns:
    - segments:
      - attrs:
          dirty:
            dtype: File
          image:
            dtype: File
          restored:
            dtype: File
          residual:
            dtype: File
          model:
            dtype: File
          psf:
            dtype: File
      - regex: .+
    inputs:
      ms:
        dtype: List[MSv2]
        required: true
        policies:
          positional: true
          repeat: list
      prefix:
        dtype: str
        required: true
        nom_de_guerre: name
        write_path: true
      column:
        dtype: str
        default: DATA
        nom_de_guerre: data-column
      model-column:
        dtype: str
      model-storage-manager:
        dtype: str
      nchan:
        nullable: false
        dtype: int
        default: 1
        info: Number of output channels (-channels-out); multiple channels also produce MFS images.
        nom_de_guerre: channels-out
      deconvolution-channels:
        dtype: int
      channel-range:
        dtype: Tuple[int, int]
        policies:
          repeat: list
      channel-division-frequencies:
        dtype: List[float]
      gap-channel-division:
        dtype: bool
      pol:
        nullable: false
        dtype: Union[str, List[str]]
        default: I
        info: Polarizations; case insensitive, comma separated or packed (e.g. IQUV).
        policies:
          repeat: ","
      join-polarizations:
        dtype: bool
      link-polarizations:
        dtype: Union[str, List[str]]
      intervals-out:
        nullable: false
        dtype: int
        default: 1
        info: Number of output time intervals inside the selected interval.
      interval:
        dtype: Tuple[int, int]
        policies:
          repeat: list
      even-timesteps:
        dtype: bool
      odd-timesteps:
        dtype: bool
      field:
        dtype: Union[str, List[int]]
      spws:
        dtype: List[int]
      threads:
        dtype: int
        nom_de_guerre: j
      parallel-gridding:
        dtype: int
      parallel-reordering:
        dtype: int
      no-work-on-master:
        dtype: bool
      channel-to-node:
        dtype: List[int]
      max-mpi-message-size:
        dtype: str
      mem:
        dtype: float
      abs-mem:
        dtype: float
      verbose:
        dtype: bool
        nom_de_guerre: v
      log-time:
        dtype: bool
      quiet:
        dtype: bool
      reorder:
        dtype: bool
      no-reorder:
        dtype: bool
      reuse-reordered:
        dtype: bool
      save-reordered:
        dtype: bool
      update-model-required:
        dtype: bool
      no-update-model-required:
        dtype: bool
      no-dirty:
        nullable: false
