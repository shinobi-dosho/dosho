_include: (dosho)documents/simms-skysim.yaml
cabs:
  simms-predict-gaul-apparent:
    _use: cabs.simms-skysim
    info: Predict unpolarized apparent PyBDSF Gaussian components into MODEL_GAUL
      without applying another primary beam or a-term.
    inputs:
      ascii-sky:
        dtype: File
        required: true
        writable: false
      ascii-species:
        dtype: str
        default: bdsf_gaul
        implicit: bdsf_gaul
        choices: [bdsf_gaul]
        nullable: false
      column:
        dtype: str
        default: MODEL_GAUL
        implicit: MODEL_GAUL
        choices: [MODEL_GAUL]
        nullable: false
      mode:
        dtype: str
        default: sim
        implicit: sim
        choices: [sim]
        nullable: false
      smearing:
        dtype: str
        default: none
        implicit: none
        choices: [none]
        nullable: false
      no-polarisation:
        dtype: bool
        default: true
        implicit: true
        choices: [true]
        nullable: false
      primary-beam:
        default: null
        choices: [null]
      # Reserve the intrinsic profile's screen inputs explicitly: static
      # models currently ignore unknown parameters, so omission alone would
      # silently accept a caller's request to apply a screen.
      aterm-config:
        dtype: File
        default: null
        choices: [null]
        pass_to_command: false
      aterm-image:
        dtype: File
        default: null
        choices: [null]
        pass_to_command: false
      source-schema:
        default: null
        choices: [null]
      fits-sky:
        default: null
        choices: [null]
      wsclean-sky:
        default: null
        choices: [null]
      polarisation:
        default: null
        choices: [null]
    dataset_accesses:
    - field: ms
      mode: write
      columns:
        create: [MODEL_GAUL]
      allow_schema_change: true
    outputs:
      model_token:
        dtype: str
        implicit: MODEL_GAUL
