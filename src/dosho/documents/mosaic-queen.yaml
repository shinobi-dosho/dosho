cabs:
  mosaic-queen:
    command: mosaic-queen
    image: MOSAIC_QUEEN
    info: 'mosaic-queen: FITS image mosaicking (https://github.com/caracal-pipeline/mosaic-queen)'
    policies:
      replace:
        _: '-'
    inputs:
      input:
        dtype: Directory
        required: true
        info: Directory containing the (2D or 3D) images and beams.
        policies:
          positional: true
      target_images:
        dtype: List[File]
        required: true
        nom_de_guerre: target-images
        info: Space-separated list of images to be mosaicked; 'image.fits' automatically replaced by 'pb.fits'
          to locate beams.
        policies:
          positional: true
      name:
        dtype: str
        required: true
        info: Prefix to be used for output files.
        policies:
          positional: true
      num_workers:
        dtype: int
        default: 0
        nom_de_guerre: num-workers
        info: Number of worker threads; 0 uses all available threads.
      associated_mosaics:
        dtype: List[File]
        nom_de_guerre: associated-mosaics
        info: Also make mosaics of associated files; space-separated list. e.g masks, models or residuals
      regrid:
        dtype: bool
        info: Use montage for regridding images and beams.
      force_regrid:
        dtype: bool
        nom_de_guerre: force-regrid
        info: Force newly-regridded files even if they exist.
      beam_cutoff:
        dtype: float
        default: 0.1
        nom_de_guerre: beam-cutoff
        info: Cutoff in the primary beam (e.g., 0.1 = 10% level).
      mosaic_cutoff:
        dtype: float
        default: 0.2
        nom_de_guerre: mosaic-cutoff
        info: Sensitivity cutoff in final mosaic; pixels with noise > min_noise / cutoff are blanked.
      unity_weights:
        dtype: bool
        nom_de_guerre: unity-weights
        info: Use weight=1 instead of weight=1/noise**2.
      statistic:
        dtype: str
        default: mad
        info: Statistic to use for estimating noise in input images.
      guess_std:
        dtype: float
        default: 0.02
        nom_de_guerre: guess-std
        info: Initial guess of noise level for '--statistic fit'.
      ra:
        dtype: float
        info: Central RA (deg) of output mosaic if not imaging full FoV.
      dec:
        dtype: float
        info: Central Dec (deg) of output mosaic if not imaging full FoV.
      velocity:
        dtype: float
        info: Central velocity/frequency of output mosaic cube.
      dra:
        dtype: float
        info: RA range of output mosaic image/cube.
      ddec:
        dtype: float
        info: Dec range of output mosaic image/cube.
      dv:
        dtype: float
        info: Velocity/frequency range of output mosaic cube.
    outputs:
      output:
        dtype: Directory
        required: true
        info: Directory for all output files.
        policies:
          positional: true
