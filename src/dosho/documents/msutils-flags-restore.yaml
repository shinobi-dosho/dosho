cabs:
  msutils-flags-restore:
    command: msutils flags restore
    image: MSUTILS
    info: 'msutils flags restore: restore an MS''s flags from a saved version'
    inputs:
      ms:
        dtype: MSv2
        required: true
        info: Measurement set to restore flags into
        policies:
          positional: true
        mutable: true
      name:
        dtype: str
        required: true
        info: Saved flag version to restore
        policies:
          positional: true
    outputs:
      ms:
        dtype: MSv2
        info: Measurement set with the restored flags
    dataset_accesses:
      # Exact and complete: msutils flags.py writes FLAG and FLAG_ROW from the
      # saved version and nothing else in the MS. Its saved-version dependency
      # is a separately declared read, never a stale-cleared output.
      - field: ms
        mode: write
        columns:
          write: [FLAG, FLAG_ROW]
    derived_reads:
      saved_version:
        member: directory
        family:
          root: '{ms}.flagversions'
          coordinates: {}
          rules:
            - path: 'flags.{name}'
              required: true
