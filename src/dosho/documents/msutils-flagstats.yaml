cabs:
  msutils-flagstats:
    command: msutils flagstats
    image: MSUTILS
    info: 'msutils flagstats: out-of-core flag statistics + matplotlib summary plot'
    policies:
      repeat_list: true
    inputs:
      ms:
        dtype: MS
        required: true
        info: Measurement set to compute flag statistics for
        policies:
          positional: true
      plot:
        write_path: true
        dtype: File
        info: Output PNG plot file.
      json_out:
        write_path: true
        dtype: File
        nom_de_guerre: json
        info: Output JSON statistics file.
      field:
        dtype: List[str]
        info: Field id/name to include (repeatable).
      antenna:
        dtype: List[str]
        info: Antenna id/name to include (repeatable).
      spw:
        dtype: List[str]
        info: Spectral window id/name to include (repeatable).
      scan:
        dtype: List[int]
        info: Scan number to include (repeatable).
      quiet:
        dtype: bool
        info: Do not print the report.
    outputs:
      plot:
        dtype: File
        info: Output PNG plot file.
      json_out:
        dtype: File
        nom_de_guerre: json
        info: Output JSON statistics file.
