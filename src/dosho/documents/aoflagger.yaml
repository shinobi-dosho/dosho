cabs:
  aoflagger:
    command: aoflagger
    image: AOFLAGGER
    info: AOFlagger automatic RFI flagger (https://aoflagger.readthedocs.io)
    policies:
      prefix: '-'
    inputs:
      msname:
        dtype: MSv2
        required: true
        mutable: true
        info: MS name(s) to be flagged
        # `aoflagger [options] <obs.ms>`: the MS is the trailing argument.
        policies:
          positional: true
      verbose:
        dtype: bool
        default: false
        nom_de_guerre: v
        info: Produce verbose output
      threads:
        dtype: int
        nom_de_guerre: j
        info: 'overrides the number of threads specified in the strategy (default: one thread for each
          CPU core)'
      strategy:
        dtype: File
        info: specifies a possible customized strategy
      indirect_read:
        dtype: bool
        default: true
        nom_de_guerre: indirect-read
        info: will reorder the measurement set before starting, which is normally faster but requires
          free disk space to reorder the data to
      memory_read:
        dtype: bool
        default: false
        nom_de_guerre: memory-read
        info: will read the entire measurement set in memory. This is the fastest, but requires much memory.
      auto_read_mode:
        dtype: bool
        default: true
        nom_de_guerre: auto-read-mode
        info: will select either memory or direct mode based on available memory
      uvw:
        dtype: bool
        default: false
        info: reads uvw values (some exotic strategies require these)
      column:
        dtype: str
        default: DATA
        info: specify column to flag
      skip_flagged:
        dtype: bool
        default: false
        nom_de_guerre: skip-flagged
        info: will skip an ms if it has already been processed by AOFlagger according to its HISTORY table.
      bands:
        dtype: int
        info: comma separated list of (zero-indexed) band ids to process
      fields:
        dtype: int
        info: Field ID(s). Comma separated string if more than one field
    outputs:
      msname:
        dtype: MSv2
        info: MS name(s) to be flagged
    dataset_accesses:
      # Checked against AOFlagger 3.5's default strategy: it flags MAIN.FLAG
      # from `column` (FLAG_ROW untouched), adds one HISTORY row, and writes
      # its statistics as four opaque QUALITY_* tables linked from MAIN
      # keywords. A strategy without `collect_statistics` adds no QUALITY_*
      # tables; the permission allows them, it does not require them.
      # UVW is read by memory/indirect readers as well as explicit -uvw.
      # Memory and indirect reads (the default `auto_read_mode` picks one)
      # open the MS for update through casacore, which rewrites the files of
      # every subtable present, optional ones included; `-direct-read` does
      # not. The present-subtable grant covers those rewrites, not schema.
      - field: msname
        mode: write
        columns:
          read: ["{column}", UVW]
          write: [FLAG]
        allow_present_subtable_rewrite: true
        allow_subtable_change:
          - QUALITY_KIND_NAME
          - QUALITY_TIME_STATISTIC
          - QUALITY_FREQUENCY_STATISTIC
          - QUALITY_BASELINE_STATISTIC
      - field: msname
        mode: write
        table: HISTORY
        allow_row_count_change: true
