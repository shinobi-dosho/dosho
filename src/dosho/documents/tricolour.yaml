cabs:
  tricolour:
    command: tricolour
    image: TRICOLOUR
    info: Tricolour RFI flagger (https://github.com/ratt-ru/tricolour)
    inputs:
      ms:
        dtype: MSv2
        required: true
        policies:
          positional: true
        mutable: true
      config:
        dtype: File
      ignore-flags:
        dtype: bool
      flagging-strategy:
        dtype: str
      row-chunks:
        dtype: int
      baseline-chunks:
        dtype: int
      nworkers:
        dtype: int
      dilate-masks:
        dtype: Union[int,str]
      data-column:
        dtype: str
      field-names:
        dtype: str
      scan_numbers:
        dtype: str
      disable-post-mortem:
        dtype: bool
        default: true
      window-backend:
        dtype: str
      temporary-directory:
        dtype: Directory
      subtract-model-column:
        dtype: str
    outputs:
      ms:
        dtype: MSv2
        policies:
          positional: true
    dataset_accesses:
      # Columns unset (whole dataset): the columns read are the `data-column`
      # and `subtract-model-column` parameters, which a static list cannot
      # follow (stimela-ninja#176). tricolour 0.2.1 writes MAIN.FLAG only.
      - field: ms
        mode: write
