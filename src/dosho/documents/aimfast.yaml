cabs:
  aimfast:
    command: aimfast
    image: AIMFAST
    info: 'aimfast: astronomical image fidelity assessment tool (https://github.com/Athanaseus/aimfast)'
    inputs:
      compare_models:
        dtype: List[File]
        nom_de_guerre: compare-models
        info: List of tigger model (text/lsm.html) files to compare, e.g. --compare-models model1.lsm.html
          model2.lsm.html
        policies:
          repeat: list
      compare_images:
        dtype: List[File]
        nom_de_guerre: compare-images
        info: List of restored image (fits) files to compare (runs a source finder first)
        policies:
          repeat: list
      compare_online:
        dtype: File
        nom_de_guerre: compare-online
        info: Catalog model (html/ascii, fits) or restored image (fits) file to compare with an online
          catalog
      compare_residuals:
        dtype: List[File]
        nom_de_guerre: compare-residuals
        info: List of noise-like (fits) files to compare, e.g. --compare-residuals residual1.fits residual2.fits
        policies:
          repeat: list
      compare_residual_subimages:
        dtype: List[File]
        nom_de_guerre: compare-residual-subimages
        info: List of noise-like (fits) files to compare (sub-image variant)
        policies:
          repeat: list
      tigger_model:
        dtype: File
        nom_de_guerre: tigger-model
        info: Name of the tigger model lsm.html file or any supported catalog
      restored_image:
        dtype: File
        nom_de_guerre: restored-image
        info: Name of the restored image fits file
      psf_image:
        dtype: str
        nom_de_guerre: psf-image
        info: Name of the point spread function file or psf size in arcsec
      residual_image:
        dtype: File
        nom_de_guerre: residual-image
        info: Name of the residual image fits file
      mask_image:
        dtype: File
        nom_de_guerre: mask-image
        info: Name of the mask image fits file
      fidelity_results:
        dtype: File
        nom_de_guerre: fidelity-results
        info: aimfast fidelity results file (JSON format)
      input_regions:
        dtype: File
        nom_de_guerre: input-regions
        info: Region file with regions to generate stats
      config:
        dtype: File
        info: Config file to run source finder of choice (YAML format)
      source_finder:
        dtype: str
        nom_de_guerre: source-finder
        info: Source finder to run if comparing restored images
      online_catalog_name:
        dtype: str
        nom_de_guerre: online-catalog-name
        info: Prefix of output catalog file name
      online_catalog:
        dtype: str
        nom_de_guerre: online-catalog
        info: Online catalog to compare local image/model
      centre_coord:
        dtype: str
        nom_de_guerre: centre_coord
        info: Centre of online catalog to compare local image/model in "RA hh:mm:ss, Dec deg:min:sec"
      width:
        dtype: float
        info: Field of view width to query online catalog in degrees, e.g. 3.0d
      normality_test:
        dtype: str
        nom_de_guerre: normality-test
        info: Name of model to use for normality testing (shapiro, normaltest)
      data_range:
        dtype: str
        nom_de_guerre: data-range
        info: Data range to perform normality testing
      threshold:
        dtype: float
        info: Get stats of channels with pixel flux above thresh in Jy/Beam; also filters online-catalog
          sources
      channels:
        dtype: str
        info: Get stats of specified channels, e.g. "10~20;100~1000"
      centre_pixels_size:
        dtype: List[str]
        nom_de_guerre: centre-pixels-size
        info: List of subimage centre pixels and their sizes to compute stats, e.g. 500,500,20 200,10,5
        policies:
          repeat: list
      data_points:
        dtype: int
        nom_de_guerre: data-points
        info: Data points to sample the residual/noise image
      flux_plot:
        dtype: str
        nom_de_guerre: flux-plot
        info: Type of plot for flux comparison of the two catalogs
      units:
        dtype: str
        info: Units to represent the results
      decimals:
        dtype: int
        info: Number of decimal places to round off results
      only_off_axis:
        dtype: float
        nom_de_guerre: only-off-axis
        info: Plot only cross-matched sources with distance from the phase centre less than this value
      area_factor:
        dtype: float
        nom_de_guerre: area-factor
        info: Factor to multiply the beam area to get target peak area
      fov_factor:
        dtype: float
        nom_de_guerre: fov-factor
        info: Factor to multiply the field of view for random points (0.0-1.0)
      tolerance:
        dtype: float
        info: Tolerance to cross-match sources in arcsec
      all_source:
        dtype: bool
        default: false
        nom_de_guerre: all-source
        info: Compare all sources irrespective of shape, otherwise only point-like sources are compared
      closest:
        dtype: bool
        info: Use the closest source only when cross matching sources
      shape_limit:
        dtype: float
        nom_de_guerre: shape-limit
        info: Cross-match only sources with a maj-axis equal or less than this value
      label:
        dtype: str
        info: Use this label instead of the FITS image path when saving data as JSON file
      x_col_data:
        dtype: str
        nom_de_guerre: x-col-data
        info: Catalog column name to plot on the x-axis
      y_col_data:
        dtype: str
        nom_de_guerre: y-col-data
        info: Catalog column name to plot on the y-axis
      x_col_err_data:
        dtype: str
        nom_de_guerre: x-col-err-data
        info: Catalog column name to plot error data on the x-axis
      y_col_err_data:
        dtype: str
        nom_de_guerre: y-col-err-data
        info: Catalog column name to plot error data on the y-axis
      x_label:
        dtype: str
        nom_de_guerre: x-label
        info: x-axis labels for the plot
      y_label:
        dtype: str
        nom_de_guerre: y-label
        info: y-axis labels for the plots
      plot_title:
        dtype: str
        nom_de_guerre: plot-title
        info: Title label for the basic catalog plot
      flux_xlabels:
        dtype: List[str]
        nom_de_guerre: flux-xlabels
        info: x-axis labels for the Flux plots
        policies:
          repeat: list
      flux_ylabels:
        dtype: List[str]
        nom_de_guerre: flux-ylabels
        info: y-axis labels for the Flux plots
        policies:
          repeat: list
      flux_plot_titles:
        dtype: List[str]
        nom_de_guerre: flux-plot-title
        info: Title labels for the Flux plots
        policies:
          repeat: list
      position_xlabels1:
        dtype: List[str]
        nom_de_guerre: position-xlabels1
        info: x-axis labels for the comparison position plots
        policies:
          repeat: list
      position_ylabels1:
        dtype: List[str]
        nom_de_guerre: position-ylabels1
        info: y-axis labels for the comparison position plots
        policies:
          repeat: list
      position_plot_title1:
        dtype: List[str]
        nom_de_guerre: position-plot-title1
        info: Title labels for the comparison position plots
        policies:
          repeat: list
      position_xlabels2:
        dtype: List[str]
        nom_de_guerre: position-xlabels2
        info: x-axis labels for the overlay position plots
        policies:
          repeat: list
      position_ylabels2:
        dtype: List[str]
        nom_de_guerre: position-ylabels2
        info: y-axis labels for the overlay position plots
        policies:
          repeat: list
      position_plot_title2:
        dtype: List[str]
        nom_de_guerre: position-plot-title2
        info: Title labels for the overlay position plots
        policies:
          repeat: list
      colorbar_major_labels_size:
        dtype: int
        nom_de_guerre: colorbar-major-labels-size
        info: x-axis label size for plots
      colorbar_labels_size:
        dtype: int
        nom_de_guerre: colorbar-labels-size
        info: x-axis label size for plots
      xlabels_size:
        dtype: int
        nom_de_guerre: xlabels-size
        info: x-axis label size for plots
      ylabels_size:
        dtype: int
        nom_de_guerre: ylabels-size
        info: y-axis label size for plots
      x_major_labels_size:
        dtype: int
        nom_de_guerre: x-major-labels-size
        info: x-axis major label size for plots
      y_major_labels_size:
        dtype: int
        nom_de_guerre: y-mojar-labels-size
        info: y-axis major label size for plots
      legend_font_size:
        dtype: int
        nom_de_guerre: legend-font-size
        info: Label size for legends on the plots
      plot_title_size:
        dtype: int
        nom_de_guerre: plot-title-size
        info: Title label size for plots
      html_prefix:
        dtype: str
        nom_de_guerre: html-prefix
        info: Prefix of output html files
      outfile:
        dtype: File
        info: 'Name of output file name (default: fidelity_results.json)'
      save_svg:
        dtype: bool
        nom_de_guerre: save-svg
        info: Save plots in SVG format
    outputs:
      outfile:
        dtype: File
        info: 'Name of output file name (default: fidelity_results.json)'
