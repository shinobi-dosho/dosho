cabs:
  msutils-renamecol:
    command: msutils renamecol
    image: MSUTILS
    info: 'msutils renamecol: rename a column in an MS'
    inputs:
      ms:
        dtype: MS
        required: true
        info: Measurement set to operate on
        policies:
          positional: true
        mutable: true
      fromcol:
        dtype: str
        required: true
        info: Column to rename
        policies:
          positional: true
      tocol:
        dtype: str
        required: true
        info: New column name
        policies:
          positional: true
    outputs:
      ms:
        dtype: MS
        info: Measurement set the column was renamed in
