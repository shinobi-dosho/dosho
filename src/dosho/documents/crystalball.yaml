cabs:
  crystalball:
    command: crystalball
    image: CRYSTALBALL
    info: 'Crystalball: predict model visibilities from a sky model (https://github.com/caracal-pipeline/crystalball)'
    inputs:
      ms:
        dtype: MS
        required: true
        policies:
          positional: true
      field:
        dtype: str
        info: The field name or id to be predicted. If not provided, only a single field may be present
          in the MS.
      output-column:
        dtype: str
        required: true
      sky_model:
        dtype: File
        required: true
        nom_de_guerre: sky-model
        info: Wsclean format sky model file.
      within:
        dtype: File
        info: A JS9 region file to constrain the model. Only sources within those regions will be included.
      num_sources:
        dtype: int
        nom_de_guerre: num-sources
        info: Select only N brightest sources
      points_only:
        dtype: bool
        default: false
        nom_de_guerre: points-only
        info: Select only point-type sources
      memory_fraction:
        dtype: float
        default: 0.1
        nom_de_guerre: memory-fraction
        info: Fraction of system RAM that can be used. Used when setting automatically the chunk size.
      num_workers:
        dtype: int
        default: 4
        nom_de_guerre: num-workers
        info: Explicitly set the number of worker threads.
    outputs:
      ms:
        dtype: MS
        policies:
          positional: true
