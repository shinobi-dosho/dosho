# dosho image manifest -- the single source of truth linking each cab's
# container image to a registry reference (and, once dosho builds its own, to
# a build recipe). Loaded by images.py, which exposes each KEY as a module
# constant (images.<KEY>) that cab modules import unchanged.
#
# Schema:
#   metadata:
#     registry: <host>/<namespace>   # where dosho-built images publish
#     bundle_version: dX.Y.Z         # tag suffix for dosho-built images
#     dev_deps: "<pip specs>"        # appended to every dev image's extra_deps
#   images:
#     <KEY>:
#       source: "<upstream repo URL>" # provenance (documentary)
#       ref: "<full image ref>"       # use this image verbatim (external)
#       #  -- OR --
#       build:                        # dosho builds this image
#         version: "<tool version>"   # -> {registry}/{name}:{version}-{bundle_version}
#         base: <KEY>                  # optional: build FROM another dosho image
#         package: "<pip spec>"        # (pip tools) installed into the image
#         dockerfile: <path under cargo/>
#         cmd: "<sanity command>"
#         platforms: [linux/amd64, linux/arm64]  # optional Buildx push targets
#         # ...arbitrary extra vars consumed by the tool's Dockerfile template
#       dev:                          # optional: a `dosho images build --dev`
#         package: "git+<repo>@main"  #   variant, i.e. the `build:` vars above
#         # ...any build: var to override #   overlaid with these
#       name: <repo>                   # optional; defaults to <KEY>.lower()
#
# Dev images (`dev:` above) exist for tools we develop against `main` rather
# than waiting on a release. They publish to the *mutable* tag
# `{registry}/{name}:dev` -- deliberately outside the immutable
# `{version}-{bundle_version}` scheme, and outside the release build plan, so a
# dev push can never overwrite a release tag. `metadata.dev_deps` is appended to
# every dev build (see its comment), and consumers should pin the resulting
# *digest*, not the tag -- see `dosho images build --dev`'s help for why.
#
# Per-deployment overrides (highest precedence last):
#   manifest  <  the YAML file named by $DOSHO_IMAGES  <  per-tool $DOSHO_IMAGE_<KEY>

metadata:
  registry: ghcr.io/shinobi-dosho
  bundle_version: d0.1.0
  # Appended to every `dev:` image's extra_deps. shinobi's API moves between
  # releases (it is on PyPI, but a release lags `main`), and a tool built from
  # its own `main` is written against shinobi `main` -- while `pip install`
  # would resolve the plain `stimela-ninja` dependency from PyPI, because a
  # tool's `[tool.uv.sources]` git pin is uv-only and stripped from the
  # published metadata. Injecting it here rather than per-entry means a new dev
  # image cannot forget it.
  #
  # A commit, not `@main`. Both tags are mutable, so the only thing separating
  # two `:dev` builds of the same tool is what they installed -- with a branch
  # name that is unknowable after the fact, and a rebuild silently picks up
  # whatever shinobi landed meanwhile. Naming the commit puts the moving part
  # in this file, where a bump is a diff someone reviews rather than a
  # coincidence of timing. Bump it deliberately (`git rev-parse origin/main` in
  # a stimela-ninja checkout) when a dev image needs something newer.
  dev_deps: "git+https://github.com/shinobi-dosho/stimela-ninja@a855c3638503e3436da2f1e48fc2049b62081d34"

images:
  # Shared Ubuntu Noble image: KERN-10 apt source, Python 3.12, casacore,
  # and the common astro Python stack. Pip children build FROM this image.
  BASE_ASTRO:
    name: base-astro
    source: "https://kernsuite.info"
    build:
      version: "noble-kern10"
      platforms: [linux/amd64, linux/arm64]
      cmd: "python3 -c 'import casacore.tables, astropy, daskms, numpy, scipy, omegaconf'"
      dockerfile: base-astro/Dockerfile

  # ---- dosho-built (everything except the deprecated SIMMS_CLASSIC ref: below) ----
  SIMMS:
    name: simms
    source: "https://github.com/shinobi-dosho/simms"
    build:
      version: "3.0.2-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      # fitstoolz requires NumPy 2; ducc0 needs a C++ source build on ARM64.
      base: BASE_ASTRO
      package: "simms==3.0.2"
      cmd: "simms --help"
      dockerfile: numpy2-casacore/Dockerfile
    dev:
      package: "git+https://github.com/shinobi-dosho/simms@main"

  FITSTOOLZ:
    name: fitstoolz
    source: "https://github.com/shinobi-dosho/fitstoolz"
    build:
      version: "0.2.2-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "fitstoolz==0.2.2"
      cmd: "fitstoolz --help"
      dockerfile: pip/Dockerfile
    dev:
      package: "git+https://github.com/shinobi-dosho/fitstoolz@main"

  MSUTILS:
    name: msutils
    source: "https://github.com/shinobi-dosho/msutils"
    build:
      version: "3.1.0-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      # [all] pulls every optional stack: plots (matplotlib, for flagstats),
      # average (codex-africanus), gains + msv4 (xarray, zarr), xarray-ms and
      # convert (xradio) -- so every wrapped subcommand works out of the box
      # rather than dying on an ImportError the cab cannot express.
      package: "msutils[all]==3.1.0"
      extra_deps: '"dask-ms>=0.2.32"'
      cmd: "msutils --help"
      dockerfile: numpy2-casacore/Dockerfile
    # 3.1.0 is the first release carrying everything the cabs describe: the
    # `gainutils` console script and subset/average's --taql/--reindex, --corr
    # and binning options. The dev image tracks msutils `main` for work not
    # yet released: `dosho images build MSUTILS --dev --push`, then point a
    # deployment at it with DOSHO_IMAGE_MSUTILS (pin the digest, not `:dev`).
    # PEP 508 direct-URL form rather than a bare `git+` URL, so `[all]`
    # survives the swap -- without it the git build installs no extras at all.
    dev:
      package: "msutils[all] @ git+https://github.com/shinobi-dosho/msutils@main"

  # WSClean also provides the chgcentre cab. IDG comes from KERN-10's
  # idg-dev package; EveryBeam 0.7 is built from source for beam support.
  WSCLEAN:
    source: "https://gitlab.com/aroffringa/wsclean"
    name: wsclean
    build:
      version: "3.6-idg-noble"
      base: BASE_ASTRO
      platforms: [linux/amd64, linux/arm64]
      package_version: "3.6"
      everybeam_version: "0.7.4"
      cmd: "wsclean --version"
      dockerfile: wsclean/Dockerfile
  # cubical 1.6.4 predates Python 3.10 (`from collections import Iterator` in
  # its own source) -- built on a dedicated era-correct Python 3.9 base, same
  # as the stimela2 image it replaces; see cargo/cubical/Dockerfile.
  CUBICAL:
    source: "https://github.com/ratt-ru/CubiCal"
    name: cubical
    build:
      version: "1.6.4-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      package_version: "1.6.4"
      python_version: "3.9"
      cmd: "gocubical --help"
      dockerfile: cubical/Dockerfile
  QUARTICAL:
    source: "https://github.com/ratt-ru/QuartiCal"
    name: quartical
    build:
      # Held at 0.2.5 deliberately. 0.2.6 and 0.2.7 SIGSEGV on any solve with
      # two or more gain terms AND two or more model directions
      # (ratt-ru/QuartiCal#435) -- which is every cycle of a self-cal loop
      # doing compact-source subtraction, since the compact model must be its
      # own direction and previously-solved terms must be listed to stay in
      # the correction. 0.2.5 is the last good release: 0.2.7 pinned to the
      # exact numba/numpy 0.2.5 resolves still faults, so it is QuartiCal's
      # regression and a dependency bump will not lift it. Do not bump to a
      # released version until one carries the #435 fix -- 0.2.7 is still the
      # latest, so that is not yet 0.2.8; see the `dev:` block below.
      version: "0.2.5-multiarch1"
      base: BASE_ASTRO
      platforms: [linux/amd64, linux/arm64]
      package: "quartical==0.2.5"
      pre_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends python3-numcodecs && rm -rf /var/lib/apt/lists/*
      post_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends python3-numcodecs && rm -rf /var/lib/apt/lists/*
        RUN python3 -c "import numpy as np, numcodecs; c=numcodecs.Blosc(); d=np.arange(16,dtype=np.int32).tobytes(); assert c.decode(c.encode(d))==d"
      # Africanus 0.4.1 requires NumPy 2. Rebuild the base casacore converter
      # against NumPy 2 and use Noble prebuilt ARM64 numcodecs package.
      # goquartical is config-file-driven and rejects --help; import-check instead.
      cmd: "python3 -c 'import quartical'"
      dockerfile: numpy2-casacore/Dockerfile
    # #435 is fixed upstream by ratt-ru/QuartiCal#437 -- the fault was a
    # direction-axis mismatch when a chain of terms is collapsed into one
    # (`solver.collapse_chain`), not the numba/numpy suspicion the release pin
    # above was chosen around. The fix lives only on the `v0.2.8-dev` branch;
    # no release carries it, so until 0.2.8 ships this is the only image that
    # can run a two-term, two-direction solve, and upstream explicitly asked
    # for stress testing on that branch. Bare `git+` URL rather than DDFacet's
    # PEP 508 direct-URL form because the release spec carries no extras to
    # preserve. `metadata.dev_deps` is appended to `extra_deps`; the shared
    # Dockerfile accepts it for dev builds with the same casacore ABI repair.
    dev:
      package: "git+https://github.com/ratt-ru/QuartiCal@v0.2.8-dev"
  AOFLAGGER:
    source: "https://gitlab.com/aroffringa/aoflagger"
    name: aoflagger
    build:
      version: "kern10-noble"
      base: BASE_ASTRO
      platforms: [linux/amd64, linux/arm64]
      cmd: "aoflagger --version"
      dockerfile: aoflagger/Dockerfile
  TRICOLOUR:
    source: "https://github.com/ratt-ru/tricolour"
    name: tricolour
    build:
      version: "0.2.1-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "tricolour==0.2.1"
      # Tricolour itself requires NumPy >2. Noble numcodecs avoids an ARM64
      # source build that incorrectly passes x86 SIMD flags to GCC.
      pre_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends python3-numcodecs && rm -rf /var/lib/apt/lists/*
      post_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends python3-numcodecs && rm -rf /var/lib/apt/lists/*
        RUN python3 -c "import numpy as np, numcodecs; c=numcodecs.Blosc(); d=np.arange(16,dtype=np.int32).tobytes(); assert c.decode(c.encode(d))==d"
        COPY tricolour_progress.py /tmp/tricolour_progress.py
        RUN python3 /tmp/tricolour_progress.py && rm /tmp/tricolour_progress.py
      cmd: "tricolour --help"
      dockerfile: numpy2-casacore/Dockerfile
  CRYSTALBALL:
    source: "https://github.com/caracal-pipeline/crystalball"
    name: crystalball
    build:
      version: "0.4.3-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "crystalball==0.4.3"
      # codex-africanus >=0.4.1 needs NumPy 2. Pin a compatible
      # Matplotlib wheel; the shared Dockerfile rebuilds casacore converters.
      extra_deps: '"matplotlib==3.11.2"'
      cmd: "crystalball --help"
      dockerfile: numpy2-casacore/Dockerfile
  OWLCAT:
    source: "https://github.com/ratt-ru/owlcat"
    name: owlcat
    build:
      version: "1.8.1-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "owlcat==1.8.1"
      # Ubuntu's python-casacore binding uses the NumPy 1.x ABI.
      extra_deps: '"numpy<2"'
      cmd: "plot-elevation-tracks.py --help"
      dockerfile: pip/Dockerfile
  # shadems needs dask's *legacy* dataframe, so the two dask specs below are
  # both load-bearing and neither is cosmetic:
  #   - plain `dask`, NOT `dask[dataframe]`. The extra pulls in `dask-expr`,
  #     and dask 2024.3+ switches `dd.DataFrame` to dask-expr's `FrameBase`
  #     whenever it is importable. shadems (0.5.4, and master) builds its
  #     dataframes with the legacy low-level constructor
  #     `dd.DataFrame(graph, name, meta=..., divisions=...)`, which FrameBase
  #     rejects -- so *every* plot died with `TypeError: FrameBase.__init__()
  #     got an unexpected keyword argument 'meta'`. Without the extra, dask
  #     falls back to the legacy implementation and shadems works. This
  #     matches shadeMS's own tested lock, which resolves dask 2024.12.1 with
  #     no dask-expr. pandas and pyarrow (the extra's other two members) are
  #     requested explicitly below so dropping it costs nothing.
  #   - `<2025.1`, because 2025.1 deletes the legacy implementation outright
  #     (dask warns "this will raise in a future version"). Bumping past it
  #     needs an upstream shadems fix first, not a pin change here.
  SHADEMS:
    source: "https://github.com/ratt-ru/shadeMS"
    name: shadems
    build:
      version: "0.5.4-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "shadems==0.5.4"
      # Python 3.12 dask-ms requires NumPy 2.
      extra_deps: 'pyarrow pandas "dask<2025.1"'
      cmd: "shadems --help"
      dockerfile: numpy2-casacore/Dockerfile
  RAGAVI:
    source: "https://github.com/ratt-ru/ragavi"
    name: ragavi
    build:
      version: "0.5.2-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      package_version: "0.5.2"
      # ragavi needs the Bokeh 2 API and NumPy 1.x casacore ABI. Its dedicated
      # Debian bookworm image supplies Python 3.11 and apt python3-casacore
      # for both platforms; see cargo/ragavi/Dockerfile.
      dockerfile: ragavi/Dockerfile
  SOFIA2:
    source: "https://gitlab.com/SoFiA-Admin/SoFiA-2"
    name: sofia2
    build:
      version: "2.7.0-noble"
      base: BASE_ASTRO
      platforms: [linux/amd64, linux/arm64]
      package_version: "2.7.0"
      # bare `sofia` wants a parameter file (exit 7); -h is the clean self-check.
      cmd: "sofia -h"
      dockerfile: sofia2/Dockerfile
  # CASA6 (casatasks/casaplotms) built fresh -- lean KERN base + casa wheels +
  # baked measures data + extracted casaplotms AppImage. The heavy, isolated one.
  CASA6:
    source: "https://casadocs.readthedocs.io"
    name: casa6
    build:
      version: "6.7"
      kern_version: "10"
      wheel_version: "6.7.0.31"
      cmd: "python3 -c 'import casatasks, casaplotms'"
      dockerfile: casa6/Dockerfile
  # Task-only CASA image; plotms stays on the existing CASA6 image.
  CASA_TASKS:
    source: "https://open-bitbucket.nrao.edu/scm/casa/casa6.git"
    name: casa-tasks
    build:
      version: "6.7.0.31"
      platforms: [linux/amd64, linux/arm64]
      cmd: "python3 -c 'from casatasks import listobs, gaincal; from casatools import table'"
      dockerfile: casa-tasks/Dockerfile
  # DEPRECATED: the pre-3.0 simms command, unused by any worker -- slated for removal.
  SIMMS_CLASSIC:
    source: "https://github.com/shinobi-dosho/simms"
    ref: "quay.io/stimela2/simms-classic:cc0.2.1"
  MOSAIC_QUEEN:
    source: "https://github.com/caracal-pipeline/MosaicQueen"
    name: mosaic-queen
    build:
      version: "2.0.2-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "mosaic-queen==2.0.2"
      pre_install: "RUN apt-get update -o APT::Update::Error-Mode=any && apt-get install -y --no-install-recommends montage && rm -rf /var/lib/apt/lists/*"
      cmd: "mosaic-queen --help"
      dockerfile: pip/Dockerfile
  MOWJSUB:
    source: "https://github.com/laduma-dev/mowjsub"
    name: mowjsub
    build:
      version: "2.0.1-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "mowjsub==2.0.1"
      # fitstoolz requires NumPy 2; rebuild casacore's converter against it.
      cmd: "vis-mowjsub --help"
      dockerfile: numpy2-casacore/Dockerfile
  BREIZORRO:
    source: "https://github.com/ratt-ru/breizorro"
    name: breizorro
    build:
      version: "0.2.0-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "breizorro==0.2.0"
      # Stimela 2 pulls psutil 5.x, which has no Python 3.12 ARM64 wheel.
      pre_install: "RUN if [ \"$(dpkg --print-architecture)\" = arm64 ]; then apt-get update -o APT::Update::Error-Mode=any && apt-get install -y --no-install-recommends build-essential python3-dev && rm -rf /var/lib/apt/lists/*; fi"
      cmd: "breizorro --help"
      dockerfile: pip/Dockerfile
  AIMFAST:
    source: "https://github.com/Athanaseus/aimfast"
    name: aimfast
    build:
      version: "1.3.4-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "aimfast==1.3.4"
      # Python 3.12 needs astLib 0.13.2, which requires NumPy 2; AIMFAST's
      # Bokeh 2-era figure keywords are patched in the dedicated Dockerfile.
      cmd: "aimfast --help"
      dockerfile: aimfast/Dockerfile
  EIDOS:
    source: "https://github.com/ratt-ru/eidos"
    name: eidos
    build:
      version: "1.1.2-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "eidos==1.1.2"
      # Preserve BASE_ASTRO's NumPy 1.x casacore ABI.
      extra_deps: "'numpy<2'"
      cmd: "eidos --help"
      dockerfile: pip/Dockerfile
  SMOPS:
    source: "https://github.com/ratt-ru/smops"
    name: smops
    build:
      version: "0.1.7-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "smops==0.1.7"
      # psutil 5.9.8 has no ARM64 wheel for Python 3.12 and builds from source.
      pre_install: "RUN apt-get update && apt-get install -y --no-install-recommends build-essential python3-dev && rm -rf /var/lib/apt/lists/*"
      # Preserve BASE_ASTRO's NumPy 1.x casacore ABI.
      extra_deps: "'numpy<2'"
      # smops 0.1.7 hard-pins stimela==2.0rc4 (a yanked pre-release), whose
      # bundled scabha fails to import on Python 3.12 (a dataclass with a
      # mutable default, fixed upstream). Same "second pip invocation"
      # workaround as AIMFAST -- see that entry's comment.
      post_install: |
        RUN pip install --break-system-packages -U stimela
        RUN python3 -c 'import numpy as np; from casacore.tables import table, maketabdesc, makescacoldesc; from tempfile import TemporaryDirectory; assert np.__version__.startswith("1."); d=TemporaryDirectory(); p=d.name+"/smoke"; t=table(p, tabledesc=maketabdesc(makescacoldesc("x", 0.0)), nrow=1, readonly=False, ack=False); t.putcell("x", 0, 1.0); t.close(); t=table(p, ack=False); assert t.getcell("x", 0)==1.0; t.close(); d.cleanup()'
      cmd: "smops --help"
      dockerfile: pip/Dockerfile
  AEGEAN:
    source: "https://github.com/PaulHancock/Aegean"
    name: aegean
    build:
      version: "2.3.5-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "AegeanTools==2.3.5"
      cmd: "aegean --help"
      dockerfile: pip/Dockerfile
  RM_TOOLS:
    source: "https://github.com/CIRADA-Tools/RM-Tools"
    name: rm-tools
    build:
      version: "1.4.11-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "RM-Tools==1.4.11"
      # do_RMsynth_1D.py unconditionally imports RMutils.util_plotTk (even
      # for --help), which does `import tkinter.ttk` -- not part of the
      # pip-installed Python, needs the system package.
      # finufft builds from source on ARM64 and needs a native C/C++ compiler
      # plus FFTW headers; otherwise CMake downloads and builds FFTW itself.
      # Set CC/CXX explicitly so CMake does not seek a missing cross compiler.
      # FINUFFT defaults to -march=native; QEMU advertises SVE2 even on generic ARM builds.
      pre_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends python3-tk build-essential libfftw3-dev && rm -rf /var/lib/apt/lists/*
        ENV CC=gcc CXX=g++
        RUN if [ "$(dpkg --print-architecture)" = arm64 ]; then pip install --break-system-packages --no-cache-dir --no-deps -Ccmake.define.FINUFFT_ARCH_FLAGS=-march=armv8-a finufft==2.5.1; fi
      cmd: "rmsynth1d --help"
      dockerfile: pip/Dockerfile
  RFINDER:
    source: "https://github.com/Fil8/RFInder"
    name: rfinder
    build:
      version: "1.1.0-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "rfinder==1.1.0"
      # rfinder imports pkg_resources at runtime; a bare `pip install` on top
      # of BASE_ASTRO can otherwise pull the newest setuptools, which dropped
      # pkg_resources.
      # Preserve BASE_ASTRO's NumPy 1.x casacore ABI.
      extra_deps: "'setuptools<81' 'numpy<2'"
      cmd: "rfinder --help"
      dockerfile: pip/Dockerfile
  PYDDI:
    source: "https://github.com/IanHeywood/pyddi"
    name: pyddi
    build:
      version: "0.0.4-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "pyddi==0.0.4"
      # Preserve BASE_ASTRO's NumPy 1.x casacore ABI.
      extra_deps: "'setuptools<81' 'numpy<2'"  # see RFINDER's comment
      # astLib builds from source and needs C headers and a native compiler.
      pre_install: |
        RUN apt-get update && apt-get install -y --no-install-recommends build-essential python3-dev && rm -rf /var/lib/apt/lists/*
        ENV CC=gcc CXX=g++
      cmd: "pyddi --help"
      dockerfile: pip/Dockerfile
  SPIMPLE:
    source: "https://github.com/ratt-ru/spimple"
    name: spimple
    build:
      version: "0.0.5-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "spimple==0.0.5"
      # codex-africanus[complete] pulls ducc0 and NumPy 2. The shared
      # converter template uses a generic ARM64 target for ducc0 and repairs
      # casacores NumPy ABI for binterps optional MeasurementSet inputs.
      # spimple 0.0.5 defines save_fits(data, name, ...) but every active
      # caller passes (name, data, ...), so FITS writes fail at runtime.
      post_install: >-
        RUN python3 -c 'from pathlib import Path; p=Path("/opt/dosho/venv/lib/python3.12/site-packages/spimple/fits.py"); s=p.read_text(); old="def save_fits(data, name, hdr,"; assert s.count(old)==1; p.write_text(s.replace(old,"def save_fits(name, data, hdr,"))'
      cmd: "spimple-binterp --help"
      dockerfile: numpy2-casacore/Dockerfile
  TIGGER_LSM:
    source: "https://github.com/ska-sa/tigger-lsm"
    name: tigger-lsm
    build:
      version: "1.8.0-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "astro-tigger-lsm==1.8.0"
      cmd: "tigger-convert --help"
      dockerfile: pip/Dockerfile
  # PyBDSF 1.14.1 cannot source-find at all against numpy 2 (#75): its
  # convex-hull deficiency test calls `np.cross` on 2-D vectors, a form numpy
  # 2.0 removed after deprecating it through 1.x, and every island big enough
  # to be a split candidate takes that path -- so Gaussian fitting dies on any
  # image holding an island bigger than `splitisl_maxsize` (50) beam areas,
  # which is to say every real one. No PyBDSF release carries a fix, so pin
  # numpy back instead. `version` carries a build-variant suffix rather than being
  # PyBDSF's version alone, as WSCLEAN's does: 1.14.1-d0.1.0 is published and
  # immutable, and this is the same PyBDSF built differently, so suffixing
  # moves the tag (giving CI's `build-plan --missing-only` one to build)
  # without spending a version or bundle_version bump on it.
  BDSF:
    source: "https://github.com/lofar-astron/PyBDSF"
    name: bdsf
    build:
      version: "1.14.1-numpy1-multiarch1"
      platforms: [linux/amd64, linux/arm64]
      base: BASE_ASTRO
      package: "bdsf==1.14.1"
      # PyBDSF has no ARM64 wheel. Build against NumPy 1 and Boost.Python.
      pre_install: |
        RUN if [ "$(dpkg --print-architecture)" = arm64 ]; then \
              apt-get update -o APT::Update::Error-Mode=any \
              && apt-get install -y --no-install-recommends \
                 build-essential gfortran python3-dev \
                 libboost-python-dev libboost-numpy-dev \
              && rm -rf /var/lib/apt/lists/* \
              && pip install --break-system-packages "numpy<2" build \
                 "cmake>=3.18" meson ninja "scikit-build>=0.13" \
                 setuptools setuptools_scm wheel; \
            fi
        ENV CC=gcc CXX=g++ FC=gfortran
      pip_install_flags: "--no-build-isolation"
      extra_deps: '"numpy<2"'
      # The sanity check has to actually source-find, and on the right kind
      # of image. PyBDSF has no CLI to --help, `import bdsf` succeeds under
      # the broken pairing, and so does a single compact source: #75's crash
      # is in the island-*splitting* path, reached only once an island is
      # larger than `splitisl_maxsize` (50) beam areas. So this is a blend of
      # seven beam-sized Gaussians sharing one ~70-beam island -- it takes
      # that path, and it fails on numpy 2 exactly as the issue reports.
      cmd: >-
        python3 -c 'import numpy as np, bdsf; from astropy.io import fits;
        y, x = np.mgrid[0:160, 0:160];
        c = [(64, 64), (76, 70), (88, 76), (76, 88), (64, 78), (94, 88), (88, 62)];
        d = np.random.default_rng(0).normal(0, 1, (160, 160)) + sum(500*np.exp(-((x-cx)**2 + (y-cy)**2)/13.52) for cx, cy in c);
        h = fits.Header(dict(CTYPE1="RA---SIN", CRVAL1=0.0, CDELT1=-0.5/3600, CRPIX1=80, CUNIT1="deg",
        CTYPE2="DEC--SIN", CRVAL2=-30.0, CDELT2=0.5/3600, CRPIX2=80, CUNIT2="deg",
        BMAJ=3/3600, BMIN=3/3600, BPA=0.0, BUNIT="Jy/beam"));
        fits.writeto("/tmp/smoke.fits", d.astype("float32"), h, overwrite=True);
        img = bdsf.process_image("/tmp/smoke.fits", thresh_isl=3.0, thresh_pix=5.0, frequency=1.4e9, quiet=True);
        assert img.nsrc >= 1, img.nsrc;
        print("bdsf", bdsf.__version__, "numpy", np.__version__, "sources", img.nsrc)'
      dockerfile: pip/Dockerfile
  # DDFacet's real runtime deps (SOFA, blitz, CASAREST, MAKEMS, MeqTrees-timba)
  # aren't KERN-suite/BASE_ASTRO packages, so this is a dedicated, from-source
  # build (adapted from DDFacet's own upstream docker.2404) rather than
  # base: BASE_ASTRO -- see cargo/ddfacet/Dockerfile's own header.
  DDFACET:
    source: "https://github.com/saopicc/DDFacet"
    name: ddfacet
    build:
      version: "1.0.0.0-multiarch"
      platforms: [linux/amd64, linux/arm64]
      package: "DDFacet[testing-requirements,fits-beam-support,kms-support,alternate-data-backends,dft-support]==1.0.0.0"
      cmd: "DDF.py --help"
      dockerfile: ddfacet/Dockerfile
    # Released DDFacet cannot jointly image multiple MSs -- the "joint" image
    # comes out with only one source in it. The fix lives on upstream `master`,
    # which no release carries (master is still self-versioned 1.0.0.0, so a
    # version bump can't express it either): hence a dev image, built from the
    # same recipe with the pip spec pointed at the branch. PEP 508 direct-URL
    # form (`name[extras] @ git+...`) rather than a bare `git+` URL, so the
    # release's extras survive the swap; pip clones with submodules, so the
    # from-source build needs nothing upstream's own docker.2404 doesn't.
    # `metadata.dev_deps` is appended to `extra_deps`, which this Dockerfile
    # doesn't reference -- correctly so, DDFacet is not written against shinobi.
    dev:
      package: "DDFacet[testing-requirements,fits-beam-support,kms-support,alternate-data-backends,dft-support] @ git+https://github.com/saopicc/DDFacet@master"
  KILLMS:
    source: "https://github.com/saopicc/killMS"
    name: killms
    build:
      version: "3.3.0-multiarch"
      package_version: "3.3.0"
      platforms: [linux/amd64, linux/arm64]
      base: DDFACET
      cmd: "kMS.py --help"
      dockerfile: killms/Dockerfile
