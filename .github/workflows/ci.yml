name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ninja-ref:
        type: string
        default: main
  workflow_dispatch:
    inputs:
      ninja-ref:
        description: Shinobi ref for paired validation (branch, tag, or commit)
        default: main
        required: false
        type: string

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra validation --group dev
      - name: Independent catalogue and validation tests
        run: uv run --no-sync pytest -q tests/test_validation.py tests/test_cli.py tests/test_images.py tests/test_image_publish_gate.py tests/test_image_publisher_cli.py tests/test_version.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out dosho
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --locked everywhere: install the versions committed in uv.lock and fail
      # if the lock does not match pyproject.toml. Without it a green run only
      # means the tree passed against whatever PyPI published that morning, and
      # a red one tomorrow cannot tell you whether this repo or a dependency
      # moved. Mirrors stimela-ninja's own CI.
      - name: Install dependencies
        run: uv sync --locked --extra validation --group dev

      - name: Check out Shinobi for paired validation
        uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/stimela-ninja
          ref: ${{ inputs.ninja-ref || 'main' }}
          path: .work-cache/shinobi-candidate

      - name: Install and verify candidate wheel pair
        run: bash .github/scripts/install-pair.sh .work-cache/shinobi-candidate

      - name: Run tests
        run: uv run --no-sync pytest -q -o pythonpath=

      - name: Lint
        run: uv run --no-sync ruff check .

      # Formatting is checked here as well as by .githooks/pre-commit, which
      # already runs both. The hook is opt-in per clone (`git config
      # core.hooksPath .githooks`) and `--no-verify` bypasses it, so without
      # this an unformatted file reaches main and the next contributor's
      # `ruff format` rewrites lines they did not touch.
      - name: Format
        run: uv run --no-sync ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dosho
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra validation --group docs

      - name: Check out Shinobi for paired validation
        uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/stimela-ninja
          ref: ${{ inputs.ninja-ref || 'main' }}
          path: .work-cache/shinobi-candidate

      - name: Install and verify candidate wheel pair
        run: bash .github/scripts/install-pair.sh .work-cache/shinobi-candidate

      - name: Build docs
        run: uv run --no-sync sphinx-build -b html docs docs/_build/html -W --keep-going

      # The build regenerates docs/reference/cabs.rst in place from the live
      # registry (docs/_ext/cab_catalog.py). If that changes the committed
      # copy, a cab change landed without regenerating the catalog.
      - name: Check cab catalog is up to date
        run: |
          if ! git diff --exit-code docs/reference/cabs.rst; then
            echo "::error file=docs/reference/cabs.rst::Cab catalog is stale. Regenerate with 'uv run python docs/_ext/cab_catalog.py' and commit docs/reference/cabs.rst -- or run 'git config core.hooksPath .githooks' once and the pre-commit hook keeps it fresh at commit time."
            exit 1
          fi
