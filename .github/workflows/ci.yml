name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out dosho
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --locked everywhere: install the versions committed in uv.lock and fail
      # if the lock does not match pyproject.toml. Without it a green run only
      # means the tree passed against whatever PyPI published that morning, and
      # a red one tomorrow cannot tell you whether this repo or a dependency
      # moved. Mirrors stimela-ninja's own CI.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --locked --group dev pytest -q

      - name: Lint
        run: uv run --locked --group dev ruff check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dosho
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run --locked --group docs sphinx-build -b html docs docs/_build/html -W --keep-going

      # The build regenerates docs/reference/cabs.rst in place from the live
      # registry (docs/_ext/cab_catalog.py). If that changes the committed
      # copy, a cab change landed without regenerating the catalog.
      - name: Check cab catalog is up to date
        run: |
          if ! git diff --exit-code docs/reference/cabs.rst; then
            echo "::error file=docs/reference/cabs.rst::Cab catalog is stale. Regenerate with 'uv run python docs/_ext/cab_catalog.py' and commit docs/reference/cabs.rst -- or run 'git config core.hooksPath .githooks' once and the pre-commit hook keeps it fresh at commit time."
            exit 1
          fi
