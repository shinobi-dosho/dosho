# Human-triggered publication from the exact reviewed PR head, before merge.
name: images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open, non-draft PR targeting main"
        required: true
        type: string
      head_sha:
        description: "Exact 40-character PR head SHA (dispatch on main)"
        required: true
        type: string
      override_unreviewed:
        description: "Admin only: allow missing approvals; checks must still pass"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: image-publication
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr_number }}
  HEAD_SHA: ${{ inputs.head_sha }}
  OVERRIDE_UNREVIEWED: ${{ inputs.override_unreviewed }}
  CANDIDATE_ROOT: ../candidate
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: trusted

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.plan.outputs.bases }}
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Require approved PR head and successful checks
        run: python3 scripts/image_publish_gate.py
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-buildx-action@v3
      # Public registry reads need no GHCR login or package write permission.
      - id: plan
        run: |
          plan="$(uv run --locked dosho images --source-root ../candidate build-plan --missing-only)"
          echo "$plan" | python3 -c 'import json,os,sys; p=json.load(sys.stdin); f=open(os.environ["GITHUB_OUTPUT"], "a"); f.write("bases="+json.dumps(p["bases"])+"\ntools="+json.dumps(p["tools"])+"\n")'

  build-base:
    needs: discover
    if: needs.discover.outputs.bases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.bases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Require approved PR head and successful checks
        run: python3 scripts/image_publish_gate.py
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          flags="--push"
          if [ "$IMAGE" = "DDFACET" ]; then
            flags="$flags --sequential-platforms --prune-between-platforms"
          fi
          uv run --locked dosho images --source-root ../candidate --pre-publish "python3 scripts/image_publish_gate.py" build "$IMAGE" $flags

  build-tools:
    needs: [discover, build-base]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.build-base.result != 'failure' && needs.build-base.result != 'cancelled' && needs.discover.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.tools) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Require approved PR head and successful checks
        run: python3 scripts/image_publish_gate.py
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          flags="--push"
          if [ "$IMAGE" != "CASA6" ]; then
            flags="$flags --sequential-platforms --prune-between-platforms"
          fi
          uv run --locked dosho images --source-root ../candidate --pre-publish "python3 scripts/image_publish_gate.py" build "$IMAGE" $flags
