# Build and publish every missing release image tag.
#
# * PR comment `/build-images` from someone with the admin or maintain role:
#   pins the PR head, waits for its CI to pass, then builds from that head and
#   replies on the PR with the result. Use it before merging an image change so
#   the merged manifest never names a tag that is not in GHCR.
# * Push to main touching the manifest or cargo: builds whatever is still
#   missing, so an image change merged without a `/build-images` heals itself.
#   `workflow_dispatch` on main does the same by hand.
#
# issue_comment runs always use main's copy of this file and of the gate, so a
# PR cannot change the rules it is judged by. The PR checkout ("candidate")
# supplies only the manifest, Dockerfiles and build contexts, read by main's
# CLI ("trusted"); no PR code runs on the credential-bearing host.
name: images

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - src/dosho/images.yaml
      - "src/dosho/cargo/**"
  workflow_dispatch:

permissions:
  contents: read

# One queue per PR and one for main. A newer request replaces an older *queued*
# one in the same queue (the newest PR head or main commit covers it); a running
# build is never cancelled. Every comment anywhere triggers this workflow, so
# only commands from owners, org members and collaborators join a PR queue:
# anyone else's comment gets a throwaway group (and, for a command, a refusal)
# and cannot displace a maintainer's queued build.
concurrency:
  group: >-
    ${{ github.event_name != 'issue_comment' && 'images-main'
    || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/build-images')
    && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    && format('images-pr-{0}', github.event.issue.number)
    || format('images-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  request:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/build-images')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      error: ${{ steps.gate.outputs.error }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Acknowledge the command
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes
      - name: Check the commenter's role and wait for CI on the PR head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: python3 scripts/image_publish_gate.py

  discover:
    needs: request
    if: >-
      !cancelled() && (needs.request.result == 'success'
      || (needs.request.result == 'skipped' && github.event_name != 'issue_comment'
      && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      bases: ${{ steps.plan.outputs.bases }}
      tools: ${{ steps.plan.outputs.tools }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.request.outputs.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-buildx-action@v3
      # Public registry reads need no GHCR login or package write permission.
      - id: plan
        run: |
          plan="$(uv run --locked dosho images --source-root ../candidate build-plan --missing-only)"
          echo "$plan" | python3 -c 'import json,os,sys; p=json.load(sys.stdin); f=open(os.environ["GITHUB_OUTPUT"], "a"); f.write("bases="+json.dumps(p["bases"])+"\ntools="+json.dumps(p["tools"])+"\n")'
          echo "source=$(git -C ../candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-base:
    needs: discover
    # `request` is skipped on push/dispatch; without !cancelled() that skip
    # would propagate here even though discover succeeded.
    if: "!cancelled() && needs.discover.result == 'success' && needs.discover.outputs.bases != '[]'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.bases) }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          flags="--push --sequential-platforms --prune-between-platforms"
          uv run --locked dosho images --source-root ../candidate build "$IMAGE" $flags

  build-tools:
    needs: [discover, build-base]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.build-base.result != 'failure' && needs.build-base.result != 'cancelled' && needs.discover.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.tools) }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          flags="--push"
          if [ "$IMAGE" != "CASA6" ]; then
            flags="$flags --sequential-platforms --prune-between-platforms"
          fi
          uv run --locked dosho images --source-root ../candidate build "$IMAGE" $flags

  report:
    needs: [request, discover, build-base, build-tools]
    if: always() && needs.request.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REQUEST: ${{ needs.request.result }}
      ERROR: ${{ needs.request.outputs.error }}
      SOURCE: ${{ needs.discover.outputs.source || needs.request.outputs.sha }}
      BASES: ${{ needs.discover.outputs.bases }}
      TOOLS: ${{ needs.discover.outputs.tools }}
      RESULTS: ${{ needs.discover.result }} ${{ needs.build-base.result }} ${{ needs.build-tools.result }}
    steps:
      - name: Reply on the PR
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$REQUEST" != success ]; then
            body="Image build refused: ${ERROR:-the request did not complete}. [Run]($run_url)"
          elif [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            body="Image build from \`$SOURCE\` failed. [Run]($run_url)"
          elif [ "$BASES" = "[]" ] && [ "$TOOLS" = "[]" ]; then
            body="Every image tag at \`$SOURCE\` is already published; nothing to build. [Run]($run_url)"
          else
            body="Published missing images from \`$SOURCE\`: bases $BASES, tools $TOOLS. [Run]($run_url)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"
